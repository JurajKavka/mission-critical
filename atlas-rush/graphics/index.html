<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Atlas Rush // Graphics Catalog</title>
  </head>
  <body>
    <main class="catalog">
      <p class="eyebrow">Mission Critical // Development reference</p>
      <h1>Atlas Rush graphics</h1>
      <p>Shared components used in the Africa survey.</p>
      <section class="catalog-section">
        <h2>Continent map</h2>
        <div id="catalog-map"></div>
        <p class="map-key">
          <span><i class="key-target"></i> Current target</span
          ><span><i class="key-guessed"></i> Identified</span>
        </p>
      </section>
      <section class="catalog-section">
        <h2>Countdown timer</h2>
        <div id="catalog-timer"></div>
      </section>
      <section class="catalog-section">
        <h2>Results modal</h2>
        <div id="catalog-results"></div>
      </section>
    </main>
    <script type="module" src="../src/catalog.ts"></script>
  </body>
</html>
