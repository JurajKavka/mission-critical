# Validates the Astro catalog and all playable games.
name: Check website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            asteroids/package-lock.json
            www/package-lock.json

      - name: Install Asteroids dependencies
        run: npm ci --prefix asteroids

      - name: Install website dependencies
        run: npm ci --prefix www

      - name: Check Asteroids
        run: npm run check --prefix asteroids

      - name: Check website
        run: npm run check --prefix www
