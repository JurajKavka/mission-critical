# Validates the Astro website and all playable games.
name: Check website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: node --test scripts/tests/atlas-rush-runner.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
