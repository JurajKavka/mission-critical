<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Asteroids // Graphics Catalog</title>
  </head>
  <body>
    <main class="catalog-shell">
      <header class="catalog-header">
        <p class="catalog-eyebrow">Mission Critical // Development reference</p>
        <h1>Asteroids graphics</h1>
        <p>
          Live previews rendered from the shared game graphics configuration.
          Edit <code>src/graphics-config.ts</code> to tune them.
        </p>
      </header>

      <section class="message-preview" aria-labelledby="messagePreviewTitle">
        <header class="message-preview-header">
          <span>Interface state</span>
          <h2 id="messagePreviewTitle">Mission ended</h2>
        </header>
        <iframe
          class="message-preview-frame"
          src="/?preview=mission-ended"
          title="Mission ended message preview"
        ></iframe>
      </section>

      <section
        class="catalog-grid"
        id="graphicsCatalog"
        aria-label="Asteroids graphic items"
      ></section>
    </main>

    <script type="module" src="/src/graphics.ts"></script>
  </body>
</html>
